# Haiwo server
# Build image: make img-build
# Start: make up or docker compose up -d
#
# Default storage backend is "file": state is persisted to /app/data/haiwo.json,
# which is mounted to ./data so it survives container restarts.
#
# To use PostgreSQL instead, set StorageConfiguration.Backend = "postgres" in
# configs/config.toml (or via env: STORAGECONFIGURATION_BACKEND=postgres) and
# point PostgresConfiguration.* at your database. Viper env override example:
# PostgresConfiguration.Host -> POSTGRESCONFIGURATION_HOST

services:
  server:
    image: dollarkiller/haiwo:latest
    container_name: haiwo-server
    ports:
      - "8181:8080"
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
      - ./data:/app/data
    restart: unless-stopped

