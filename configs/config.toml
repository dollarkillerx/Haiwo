[ServiceConfiguration]
Addr = ":8080"
Debug = true

[AgentConfiguration]
Token = "dev-agent-token"

[WebConfiguration]
Password = "haiwo"

[StorageConfiguration]
# Backend selects where data is persisted: "file" (default) or "postgres".
Backend = "file"
# DataFile is the control-plane state file used by the file backend.
DataFile = "./data/haiwo.json"
# LogFile is the separate run-log stream. It is rotated once it would exceed
# LogMaxMB megabytes (the previous segment is dropped, keeping recent logs).
LogFile = "./data/haiwo.log"
LogMaxMB = 50

[PostgresConfiguration]
# Connection settings used only when StorageConfiguration.Backend = "postgres".
Host = "127.0.0.1"
Port = 18432
User = "pacman"
Password = ""
DBName = "pacman"
SSLMode = "disable"
TimeZone = "UTC"
# LogMode: none, console, slow_query
LogMode = "none"
